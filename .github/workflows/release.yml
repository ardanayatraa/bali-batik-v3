# PRs are checked; pushes and merged PRs on main publish an update.
name: Release theme

on:
  push:
    branches: [main]
    paths:
      - 'bali-batik-v3/**'
      - 'tools/**'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check theme and release tooling
        run: |
          find bali-batik-v3 tools -name '*.php' -print0 | xargs -0 -n1 php -l
          php tools/test-updater.php
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/release.py

  release:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          python3 tools/prepare-release.py --latest "$LATEST" --github-output "$GITHUB_OUTPUT"

      - name: Save release version on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bali-batik-v3/style.css bali-batik-v3/functions.php bali-batik-v3/CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Release v${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build package
        run: python3 tools/release.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-list -n1 "$TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already points to another commit"; exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          SHA=$(cut -d' ' -f1 "dist/bali-batik-v3-$VERSION.zip.sha256")
          gh release create "$TAG" "dist/bali-batik-v3-$VERSION.zip" "dist/bali-batik-v3-$VERSION.zip.sha256" \
            --verify-tag \
            --title "Bali Batik V3 $VERSION" \
            --notes "Theme update from main. Commit: $(git rev-parse HEAD)

          sha256: $SHA"
