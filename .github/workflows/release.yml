# Push a tag like v3.2.1 → this builds bali-batik-v3-3.2.1.zip and publishes a
# GitHub Release. Sites whose update source is "owner/repository" see the new
# version and, with automatic updates on, install it themselves.
name: Release theme

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches theme version
        run: |
          VERSION=$(grep -m1 '^Version:' bali-batik-v3/style.css | awk '{print $2}')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match style.css Version $VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          find bali-batik-v3 tools -name '*.php' -print0 | xargs -0 -n1 php -l
          php tools/test-updater.php
          python3 tools/release.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(cut -d' ' -f1 "dist/bali-batik-v3-$VERSION.zip.sha256")
          gh release create "$GITHUB_REF_NAME" "dist/bali-batik-v3-$VERSION.zip" "dist/bali-batik-v3-$VERSION.zip.sha256" \
            --verify-tag \
            --title "Bali Batik V3 $VERSION" \
            --notes "sha256: $SHA"
